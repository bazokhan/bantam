name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run adapters:smoke
      - uses: docker/setup-buildx-action@v3
      - name: Build container image
        run: docker build --tag bantam:ci .
      - name: Smoke test - boot container, hit readyz + admin
        run: >-
          docker run -d --name bantam-ci
          --entrypoint node
          -p 3000:3000
          -e BANTAM_CONFIG_FILE=/etc/bantam/games.json
          -e BANTAM_DATA_DIR=/data
          -e BANTAM_ADAPTERS_DIR=/bantam/adapters
          -e PORT=3000
          -e NODE_ENV=production
          --env-file .env.demo
          -v bantam-ci-data:/data
          -v "$PWD/config/games.demo.json:/etc/bantam/games.json:ro"
          -v "$PWD/test/fixtures/adapters:/bantam/adapters:ro"
          bantam:ci dist/main.js
      - name: Wait for service
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
      - run: curl --fail http://127.0.0.1:3000/readyz
      - run: >
          curl --fail -H "Authorization: Bearer demo-only-admin-token-please-rotate"
          http://127.0.0.1:3000/admin/
      - run: npm run smoke:http
      - if: always()
        run: docker logs bantam-ci --no-color || true
      - if: always()
        run: docker rm -f bantam-ci || true
      - if: always()
        run: docker volume rm bantam-ci-data || true
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm --prefix docs ci
      - run: npm run docs:build
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: bazokhan
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: bazokhan/bantam
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value={{tag}}
            type=match,pattern=v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
