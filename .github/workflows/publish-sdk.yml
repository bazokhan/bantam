# Trusted publisher for @gamercury/bantam-sdk.
# npmjs.com must name this exact filename (publish-sdk.yml), GitHub user bazokhan,
# and repository bantam. No NPM_TOKEN. Do not fold this job into ci.yml.
name: Publish SDK
on:
  push:
    tags:
      - "sdk-v*"
# Job permissions replace these; id-token must be write so Actions exports
# ACTIONS_ID_TOKEN_REQUEST_* and npm can start OIDC.
permissions:
  contents: read
  id-token: write
jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check tag matches packages/sdk version
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          pkg="$(node -p "require('./packages/sdk/package.json').version")"
          test "$tag" = "$pkg"
      - name: Publish with OIDC trusted publishing
        working-directory: packages/sdk
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL is empty; id-token: write did not take effect" >&2
            exit 1
          fi
          echo "npm=$(npm --version)"
          unset NODE_AUTH_TOKEN NPM_TOKEN
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC_PATH" ]; then
            # setup-node's registry-url writes always-auth=true and an empty
            # _authToken. Either line makes npm skip OIDC (404 or ENEEDAUTH).
            printf 'registry=https://registry.npmjs.org/\n' > "$NPMRC_PATH"
          fi
          npm publish --access public
