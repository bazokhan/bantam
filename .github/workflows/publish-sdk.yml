# Trusted publisher for @gamercury/bantam-sdk.
# npmjs.com must name this exact filename (publish-sdk.yml), GitHub user bazokhan,
# and repository bantam. No NPM_TOKEN. Do not fold this job into ci.yml.
name: Publish SDK
on:
  push:
    tags:
      - "sdk-v*"
permissions:
  contents: read
jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Do not set registry-url. setup-node then writes
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and exports a dummy
      # NODE_AUTH_TOKEN, so npm skips OIDC and the registry returns 404.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check tag matches packages/sdk version
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          pkg="$(node -p "require('./packages/sdk/package.json').version")"
          test "$tag" = "$pkg"
      - name: Publish with OIDC trusted publishing
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -n "$NPM_CONFIG_USERCONFIG" ]; then
            unset NPM_CONFIG_USERCONFIG
          fi
          if [ -f "$NPMRC_PATH" ]; then
            sed -i '/_authToken/d' "$NPMRC_PATH"
          fi
          npm publish -w @gamercury/bantam-sdk --access public
