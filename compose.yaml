name: bantam

services:
  bantam:
    build: .
    image: bantam:local
    ports: ["3000:3000"]
    env_file: [.env.demo]
    environment:
      BANTAM_CONFIG_FILE: /etc/bantam/games.json
      BANTAM_DATA_DIR: /data
      BANTAM_ADAPTERS_DIR: /bantam/adapters
      LITESTREAM_CONFIG: /data/litestream.generated.yml
      LITESTREAM_REPLICA_URL: s3://bantam-local/backups
      LITESTREAM_ENDPOINT: http://rustfs:9000
      LITESTREAM_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: bantam-demo
      AWS_SECRET_ACCESS_KEY: bantam-demo-password
      AWS_REGION: us-east-1
    volumes:
      - bantam-data:/data
      # Demo manifest is mounted read-only — useful for shipping a known game.
      # The console's typed editors (Settings, the economy catalog) write the
      # manifest, so they need a writable one: drop this mount and let the
      # server own /etc/bantam/games.json, then edit from the console after
      # the inaugural admin registration.
      - ./config/games.demo.json:/etc/bantam/games.json:ro
      - ./test/fixtures/adapters:/bantam/adapters:ro
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      bucket-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { memory: 256M, cpus: "1.0" }
  rustfs:
    image: rustfs/rustfs:latest
    command: ["--address", ":9000", "--console-address", ":9001", "/data/rustfs"]
    environment:
      RUSTFS_ACCESS_KEY: bantam-demo
      RUSTFS_SECRET_KEY: bantam-demo-password
      RUSTFS_REGION: us-east-1
    volumes: [rustfs-data:/data/rustfs]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
  bucket-init:
    image: amazon/aws-cli:2.17.0
    depends_on:
      rustfs: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: bantam-demo
      AWS_SECRET_ACCESS_KEY: bantam-demo-password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket bantam-local 2>/dev/null; do
          aws --endpoint-url http://rustfs:9000 s3 mb s3://bantam-local >/dev/null
          break
        done
volumes:
  bantam-data:
  rustfs-data:
