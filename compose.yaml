name: bantam

services:
  bantam:
    build: .
    image: bantam:local
    ports: ["3000:3000"]
    env_file: [.env.demo]
    environment:
      BANTAM_CONFIG_FILE: /etc/bantam/games.json
      BANTAM_DATA_DIR: /data
      BANTAM_ADAPTERS_DIR: /bantam/adapters
      LITESTREAM_CONFIG: /data/litestream.generated.yml
      LITESTREAM_REPLICA_URL: s3://bantam-local/backups
      LITESTREAM_ENDPOINT: http://minio:9000
      LITESTREAM_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: bantam-demo
      AWS_SECRET_ACCESS_KEY: bantam-demo-password
      AWS_REGION: us-east-1
    volumes:
      - bantam-data:/data
      - ./config/games.demo.json:/etc/bantam/games.json:ro
      - ./test/fixtures/adapters:/bantam/adapters:ro
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { memory: 256M, cpus: "1.0" }
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: bantam-demo
      MINIO_ROOT_PASSWORD: bantam-demo-password
    volumes: [minio-data:/data]
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "until mc alias set local http://minio:9000 bantam-demo bantam-demo-password; do sleep 1; done; mc mb --ignore-existing local/bantam-local",
      ]
volumes:
  bantam-data:
  minio-data:
